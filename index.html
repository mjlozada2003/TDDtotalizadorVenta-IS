<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Venta-Totalizador</title>
  </head>
  <body>
    <h1>Totalizador Ventas</h1>
    <form id="totalizar-form">
      <label for="cantidad">Cantidad de item: </label>
      <input type="number" id="cantidad" />
      <br>
      <label for="precio-item">Precio por item: </label>
      <input type="number" id="precio-item" step="0.01" />
      <br>
      <label for="codigo-estado">Codigo de estado: </label>
      <select id="codigo-estado">
        <option value = "UT">UT</option>
        <option value = "NV">NV</option>
        <option value = "TX">TX</option>
        <option value = "AL">AL</option>
        <option value = "CA">CA</option>
      </select>
      <br>
      <label for="categoria-producto">Categoria de producto: </label>
      <select id="categoria-producto">
        <option value = "Alimentos">Alimentos</option>
        <option value = "Bebidas alcoholicas"> Bebidas Alcoholicas</option>
        <option value = "Material de escritorio">Material de escritorio</option>
        <option value = "Muebles"> Muebles</option>
      </select>
      <input type="submit" value="Totalizar" id="totalizar-button" />
    </form>
    <div id="resultado-div">

    </div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
